<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">codex-live-bridge local architecture</title>
  <desc id="desc">Codex and scripts connect through local OSC and UDP on 127.0.0.1 to LiveUdpBridge, a Max for Live device in Ableton Live. Read-only inspection is available, and writes require authentication.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1L6 4L1 7" fill="none" stroke="#7c858e" stroke-width="1"/>
    </marker>
    <style>
      text { font-family: Lato, Arial, sans-serif; font-weight: 300; }
      .title { fill: #fffdfc; font-size: 31px; }
      .node { fill: #fffdfc; font-size: 23px; }
      .detail { fill: #a8b0b8; font-size: 16px; }
      .note { fill: #a8b0b8; font-size: 15px; }
    </style>
  </defs>

  <rect width="1440" height="520" rx="12" fill="#08090b"/>

  <text x="96" y="104" class="title">codex-live-bridge</text>
  <path d="M96 142H1344" stroke="#393d3f" stroke-width="1"/>

  <rect x="96" y="205" width="220" height="120" rx="8" fill="#111215" stroke="#393d3f"/>
  <text x="206" y="257" class="node" text-anchor="middle">codex / scripts</text>
  <text x="206" y="287" class="detail" text-anchor="middle">local client</text>

  <path d="M316 265H369" stroke="#7c858e" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="380" y="205" width="250" height="120" rx="8" fill="#111215" stroke="#393d3f"/>
  <text x="505" y="257" class="node" text-anchor="middle">OSC / UDP</text>
  <text x="505" y="287" class="detail" text-anchor="middle">127.0.0.1</text>

  <path d="M630 265H683" stroke="#7c858e" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="694" y="205" width="288" height="120" rx="8" fill="#111215" stroke="#d2dae3"/>
  <text x="838" y="257" class="node" text-anchor="middle">LiveUdpBridge</text>
  <text x="838" y="287" class="detail" text-anchor="middle">Max for Live</text>

  <path d="M982 265H1035" stroke="#7c858e" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="1046" y="205" width="298" height="120" rx="8" fill="#111215" stroke="#393d3f"/>
  <text x="1195" y="257" class="node" text-anchor="middle">Ableton Live</text>
  <text x="1195" y="287" class="detail" text-anchor="middle">current Live set</text>

  <path d="M96 394H1344" stroke="#393d3f" stroke-width="1"/>
  <text x="96" y="431" class="note">read-only inspection</text>
  <text x="306" y="431" class="note">authenticated writes</text>
  <text x="1344" y="431" class="note" text-anchor="end">9000 commands · 9001 acknowledgements</text>
</svg>
